<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Roof Master Pro</title>
    <style>
      /* Додамо трохи коду сюди, щоб кнопки запрацювали відразу */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Забороняє прокрутку */
        position: fixed; /* Фіксує екран */
        touch-action: none; /* Вимикає зайві жести смартфона */
      }
      button {
        touch-action: manipulation; /* Прибирає затримку натискання */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
